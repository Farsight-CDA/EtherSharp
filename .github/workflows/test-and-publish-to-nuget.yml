# NOTE: NuGet trusted publishing is bound to this workflow's file name. Do not rename this file.
name: Test and Publish

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench/**"
      - "experiments/**"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEST_PROJECT: tests/EtherSharp.Tests.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.x"

      - name: Restore dependencies
        run: dotnet restore "$TEST_PROJECT"

      - name: Build
        run: dotnet build "$TEST_PROJECT" --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test "$TEST_PROJECT" --configuration Release --no-build

      - name: Calculate private package version
        id: package_version
        shell: bash
        run: |
          version="$(dotnet msbuild src/EtherSharp/EtherSharp.csproj -nologo -getProperty:Version)"

          if [[ -z "$version" ]]; then
            echo "Could not find Version element in src/EtherSharp/EtherSharp.csproj"
            exit 1
          fi

          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-.*)?$ ]]; then
            echo "Unexpected Version format '$version' in src/EtherSharp/EtherSharp.csproj"
            exit 1
          fi

          base_version="${BASH_REMATCH[1]}"
          IFS='.' read -r major minor patch <<< "$base_version"
          next_patch=$((patch + 1))
          build_number="${{ github.run_number }}"
          run_attempt="${{ github.run_attempt }}"
          package_version="$major.$minor.$next_patch-private.$build_number.$run_attempt"

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Pack
        id: pack
        shell: bash
        env:
          PRIVATE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          for project in EtherSharp EtherSharp.ERC EtherSharp.Interpreter; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-build --output ./nupkgs/public
            dotnet pack "src/$project/$project.csproj" --configuration Release --no-build --output ./nupkgs/private "/p:Version=$PRIVATE_VERSION"
          done

      - name: Publish to private NuGet feed
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        env:
          API_KEY: ${{ secrets.NUGET_PRIVATE_API_KEY }}
        run: dotnet nuget push ./nupkgs/private/*.nupkg --source https://nuget.farsight-cda.de/nuget/farsight-packages/v3/index.json --api-key "$API_KEY" --skip-duplicate

      - name: NuGet login
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Playwo

      - name: Publish to NuGet
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        env:
          API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkgs/public/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
