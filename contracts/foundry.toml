[profile.default]
src = "src"
out = "out"
libs = ["lib"]
bytecode_hash = "None"
cbor_metadata = false

additional_compiler_profiles = [
    { name = "querier", optimizer = true, optimizer_runs = 1, evm_version = "london" },
    { name = "interpreter-data-provider", optimizer = true, optimizer_runs = 1, evm_version = "cancun" },
]

compilation_restrictions = [
    { paths = "src/Querier.yul", optimizer_runs = 1, evm_version = "london" },
    { paths = "src/InterpreterDataProvider.yul", optimizer_runs = 1, evm_version = "cancun" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
